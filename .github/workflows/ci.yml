name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libssl-dev liburing-dev pkg-config

      - name: Build C++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build

      - name: Build Rust
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --manifest-path rust/Cargo.toml

      - name: Smoke run
        run: python3 scripts/run.py --quick --name ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/ci.*
