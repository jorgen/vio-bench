[package]
name = "bench_tokio"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bench_tokio"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt", "net", "time", "fs", "sync", "io-util", "macros"] }
tokio-rustls = "0.26"
rustls = "0.23"
tokio-openssl = "0.6"
openssl = "0.10"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
lto = "thin"
codegen-units = 1
